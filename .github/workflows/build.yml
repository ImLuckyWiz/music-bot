name: Build Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin
        run: |
          bun run build

      - name: Verify archive contents
        run: |
          echo "=== Contents of generated archive ==="
          tar -ztvf dist/music-bot-*.tar.gz
          echo "=== SHA-256 Checksum ==="
          sha256sum dist/music-bot-*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-bot-build
          path: |
            dist/*.tar.gz
            dist/*.json
            dist/music-bot/
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"
          ARCHIVE="dist/music-bot-${VERSION}.tar.gz"
          META="dist/${VERSION}.json"

          cat << 'EOF' > release_notes.md
          ### Music Bot v${VERSION}
          - **Fix Track Skipping & Queue Jumping with Autoplay**: Skipping a track (`nextMusic`) or jumping to a queued track (`jumpToQueueItem`) now cleanly stops the current stream and immediately starts the next track / autoplay recommendation, fixing an issue where skipped tracks aborted playback due to stream generation mismatches.
          - **Resilient Autoplay Candidate Retries**: When an autoplay recommendation cannot be resolved (e.g. YouTube age-restriction, sign-in requirement, or region block), autoplay automatically skips it and attempts the next candidates in the radio list (up to 5 retries) instead of aborting.
          - **Failed Candidate Blacklisting**: Unplayable or restricted tracks are tracked in the channel's recent history to avoid repeatedly selecting them during the same session.
          - **Interactive Seeking & Scrubber**: Full timeline seek bar with live scrubbing support.
          - **YouTube Music Radio Autoplay**: Queries YouTube Music radio (`RDAMVM<videoId>`) in audio-only mode for studio audio tracks.
          - **Fast InnerTube Search & Queueing**: High-speed direct InnerTube requests (~200–400ms) with studio audio preference in audio-only mode.
          - **Built for Sharkord**: Unpacks to `music-bot/` containing `manifest.json`, `client/index.js`, and `server/index.js`.
          EOF

          echo "Checking release for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "$ARCHIVE" "$META" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$ARCHIVE" "$META" \
              --title "v${VERSION} - Fix Skipping with Autoplay & Stream Stability" \
              --notes-file release_notes.md
          fi

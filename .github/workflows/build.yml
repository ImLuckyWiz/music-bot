name: Build Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin
        run: |
          bun run build

      - name: Verify archive contents
        run: |
          echo "=== Contents of generated archive ==="
          tar -ztvf dist/music-bot-*.tar.gz
          echo "=== SHA-256 Checksum ==="
          sha256sum dist/music-bot-*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-bot-build
          path: |
            dist/*.tar.gz
            dist/*.json
            dist/music-bot/
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"
          ARCHIVE="dist/music-bot-${VERSION}.tar.gz"
          META="dist/${VERSION}.json"

          cat << 'EOF' > release_notes.md
          ### Music Bot Video Streaming Stability & Buffer Improvements v${VERSION}
          - **Input Ring Buffer**: FFmpeg `async:` protocol with a 4 MB read-ahead buffer so CDN stalls or network resets don't freeze the stream.
          - **Robust Reconnection**: Auto-reconnect on network errors and HTTP 4xx/5xx resets (`-reconnect_on_network_error`, `-reconnect_on_http_error`) with a 15s timeout.
          - **30 FPS Limiter**: New setting to prefer $\le 30$ fps video variants, reducing bandwidth and packet rate by half to prevent stutter.
          - **Resolution Settings**: Added 480p option and adjusted default resolution to 720p for optimal stability.
          - **Built for Sharkord**: Unpacks to `music-bot/` containing `manifest.json`, `client/index.js`, and `server/index.js`.
          EOF

          echo "Checking release for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "$ARCHIVE" "$META" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$ARCHIVE" "$META" \
              --title "v${VERSION} - Video Streaming Stability & Buffer Improvements" \
              --notes-file release_notes.md
          fi

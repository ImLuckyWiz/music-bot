name: Build Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin
        run: |
          bun run build

      - name: Verify archive contents
        run: |
          echo "=== Contents of generated archive ==="
          tar -ztvf dist/music-bot-*.tar.gz
          echo "=== SHA-256 Checksum ==="
          sha256sum dist/music-bot-*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-bot-build
          path: |
            dist/*.tar.gz
            dist/*.json
            dist/music-bot/
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"
          ARCHIVE="dist/music-bot-${VERSION}.tar.gz"
          META="dist/${VERSION}.json"

          cat << 'EOF' > release_notes.md
          ### Music Bot Video Stutter Fix & Buffer Optimization v${VERSION}
          - **Video Stutter Elimination**: Prioritizes VP9 streams first across all resolutions. Unlike YouTube's H.264 (which uses B-frames that cause backwards RTP timestamp jumps in WebRTC), VP9 has no display-order reordering and plays completely smoothly.
          - **Zero B-Frame H.264 Fallback**: Re-encodes H.264 fallback streams with `-bf 0` (baseline, zero B-frames) to keep RTP timestamps strictly monotonic.
          - **Pipelined Chunk Proxy**: Switched chunk proxy to 2 MB chunks with 3 read-ahead chunks in flight to bypass GoogleVideo playback-speed throttling.
          - **Initial Read Burst**: Configured `-readrate_initial_burst 1` on FFmpeg inputs so the demuxer buffer fills immediately on startup.
          - **Built for Sharkord**: Unpacks to `music-bot/` containing `manifest.json`, `client/index.js`, and `server/index.js`.
          EOF

          echo "Checking release for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "$ARCHIVE" "$META" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$ARCHIVE" "$META" \
              --title "v${VERSION} - Video Stutter Fix & Buffer Optimization" \
              --notes-file release_notes.md
          fi

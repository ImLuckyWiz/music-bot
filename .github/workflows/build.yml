name: Build Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin
        run: |
          bun run build

      - name: Verify archive contents
        run: |
          echo "=== Contents of generated archive ==="
          tar -ztvf dist/music-bot-*.tar.gz
          echo "=== SHA-256 Checksum ==="
          sha256sum dist/music-bot-*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-bot-build
          path: |
            dist/*.tar.gz
            dist/*.json
            dist/music-bot/
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"
          ARCHIVE="dist/music-bot-${VERSION}.tar.gz"
          META="dist/${VERSION}.json"

          cat << 'EOF' > release_notes.md
          ### Music Bot Native Video Streaming v${VERSION}
          - **Native Video Streaming**: Streams YouTube video into voice channels as a native WebRTC video tile alongside audio.
          - **Zero-Transcode Stream Copy**: Uses FFmpeg stream copy (`-c:v copy`) for H.264 (avc1) and VP9 (vp09), resulting in near-zero server CPU usage.
          - **Dynamic Codec Selection**: Automatically creates matching H.264 or VP9 WebRTC producers based on the stream source.
          - **Resolution & Video Controls**: Configurable resolution settings (720p, 1080p, 1440p) and a "Stream Video" toggle in plugin settings.
          - **In-Player Video Badge**: Shows active resolution and codec badge (e.g. `1080p VP9`) during video playback.
          - **Graceful Fallback**: Automatically falls back to audio-only streaming for audio-only links (SoundCloud, direct links) or unsupported video codecs.
          - **Built for Sharkord**: Unpacks to `music-bot/` containing `manifest.json`, `client/index.js`, and `server/index.js`.
          EOF

          echo "Checking release for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "$ARCHIVE" "$META" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$ARCHIVE" "$META" \
              --title "v${VERSION} - Native WebRTC Video Streaming" \
              --notes-file release_notes.md
          fi

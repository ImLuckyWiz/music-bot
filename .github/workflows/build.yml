name: Build Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin
        run: |
          bun run build

      - name: Verify archive contents
        run: |
          echo "=== Contents of generated archive ==="
          tar -ztvf dist/music-bot-*.tar.gz
          echo "=== SHA-256 Checksum ==="
          sha256sum dist/music-bot-*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-bot-build
          path: |
            dist/*.tar.gz
            dist/*.json
            dist/music-bot/
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"
          ARCHIVE="dist/music-bot-${VERSION}.tar.gz"
          META="dist/${VERSION}.json"

          cat << 'EOF' > release_notes.md
          ### Music Bot v${VERSION}
          - **Fast InnerTube Search**: Bypasses slow `yt-dlp` child-process search (~5s) in favor of direct InnerTube HTTP requests (~250–500ms).
          - **Audio Version Preference (Audio-Only Mode)**: When video is disabled (`videoEnabled = false`), searches route to YouTube Music (`WEB_REMIX`) with Songs filtering to prioritize clean studio audio/Topic tracks over music videos with dialogue and skits.
          - **Video Search Routing (Video Mode)**: When video is enabled (`videoEnabled = true`), searches route to standard YouTube (`WEB`) to prioritize official music videos.
          - **Instant Queue Resolution**: Resolves search queries to direct URLs prior to enqueuing, displaying real video links immediately.
          - **Robust Fallback & Proxy Support**: Gracefully falls back to `ytsearch:` if InnerTube is unreachable and forwards proxy settings if configured.
          - **Built for Sharkord**: Unpacks to `music-bot/` containing `manifest.json`, `client/index.js`, and `server/index.js`.
          EOF

          echo "Checking release for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "$ARCHIVE" "$META" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$ARCHIVE" "$META" \
              --title "v${VERSION} - Fast Search & Audio-Preferred Playback" \
              --notes-file release_notes.md
          fi

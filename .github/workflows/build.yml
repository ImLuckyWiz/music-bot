name: Build Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin
        run: |
          bun run build

      - name: Verify archive contents
        run: |
          echo "=== Contents of generated archive ==="
          tar -ztvf dist/music-bot-*.tar.gz
          echo "=== SHA-256 Checksum ==="
          sha256sum dist/music-bot-*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-bot-build
          path: |
            dist/*.tar.gz
            dist/*.json
            dist/music-bot/
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"
          ARCHIVE="dist/music-bot-${VERSION}.tar.gz"
          META="dist/${VERSION}.json"

          cat << 'EOF' > release_notes.md
          ### Music Bot Chunked Input Proxy v${VERSION}
          - **Local Chunk Proxy (Experimental)**: Fetches YouTube media in 10 MB ranged requests over a local `127.0.0.1` proxy with proactive read-ahead and retry handling, eliminating GoogleVideo connection dropouts.
          - **Mid-Stream URL Refresh**: Re-resolves expired CDN URLs on the fly if YouTube links expire during long videos.
          - **Seamless Direct Fallback**: Reverts transparently to direct input connections if the proxy fails to initialize.
          - **Built for Sharkord**: Unpacks to `music-bot/` containing `manifest.json`, `client/index.js`, and `server/index.js`.
          EOF

          echo "Checking release for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "$ARCHIVE" "$META" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$ARCHIVE" "$META" \
              --title "v${VERSION} - Chunked Input Proxy" \
              --notes-file release_notes.md
          fi
